[package]
name = "earmuff"
version = "0.1.0"
edition = "2024"
description = "Battery and settings for the HyperX Cloud Alpha Wireless"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
glib-unix = "0.22.8"
gtk = { version = "0.11.5", package = "gtk4" }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
libc = "0.2.191"
serde_json = "1.0.154"

[profile.release]
strip = true
