[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xlizer1/earmuff"

[workspace.dependencies]
earmuff-application = { path = "crates/earmuff-application" }
earmuff-domain = { path = "crates/earmuff-domain" }
earmuff-infrastructure = { path = "crates/earmuff-infrastructure" }
earmuff-protocols = { path = "crates/earmuff-protocols" }

adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
gtk = { version = "0.11.5", package = "gtk4" }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
rustix = { version = "1.1.6", features = ["event"] }
serde_json = "1.0.154"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
